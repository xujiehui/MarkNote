name: Shared Quality Gates

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Frozen install, lint, tests and production builds
    runs-on: ubuntu-latest
    env:
      NPM_VERSION: '11.9.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.9.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build renderer and Electron main process
        run: npm run desktop:build

      - name: Verify offline build artifact
        run: node tests/pwaOffline.test.cjs --distribution dist

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      - name: Test browser workflows
        run: npm run test:e2e

      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-browser-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
